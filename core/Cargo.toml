[package]
name = "ron-browser-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cpg-rs = { path = "../../cpg-rs" }
flate2 = "1"
image ={ version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ron = { path = "../../ron" }
unicode-segmentation = "1"
ureq = "3"
url = "2"

[lints.rust]
unsafe_code = "forbid"
